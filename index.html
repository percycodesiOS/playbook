  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

h: min(560px, 90%); height: 8px; border-radius: 5px; background: #1E2C25; overflow: hidden; position: relative;\">\n          <div style=\"position: absolute; inset: 0 auto 0 0; width: {{ progressPct }}%; background: {{ timerColor }}; border-radius: 5px; transition: width .5s linear;\"><\u002Fdiv>\n          <sc-for list=\"{{ phaseDividers }}\" as=\"pd\" hint-placeholder-count=\"3\">\n            <div style=\"position: absolute; top: 0; bottom: 0; left: {{ pd.left }}%; width: 2px; background: #0F1613;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-top: 5px solid {{ timerColor }}; border-radius: 16px; padding: clamp(18px, 3vw, 30px); width: 100%; box-sizing: border-box;\">\n          <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2.5px; color: {{ timerColor }}; margin-bottom: 8px;\">RIGHT NOW<\u002Fdiv>\n          <div style=\"font-size: clamp(24px, 3.6vw, 42px); font-weight: bold; line-height: 1.3; text-wrap: pretty; color: #fff;\">{{ rightNow }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cueVisible }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"align-self: flex-start; background: rgba(31,199,122,.08); border-left: 4px solid #1FC77A; border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #9FE8C4; max-width: 640px;\"><b style=\"letter-spacing: 1px;\">NEXT MOVE:<\u002Fb> {{ teacherCue }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"background: #0C1210; border-top: 1px solid #2A3A32; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;\">\n        <button sc-camel-on-click=\"{{ toggleTimer }}\" style=\"min-height: 52px; min-width: 130px; padding: 12px 26px; border-radius: 12px; border: 0; background: #1FC77A; color: #06130C; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer;\" style-hover=\"background: #53D337;\">{{ startLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ skipPhase }}\" style=\"min-height: 52px; padding: 12px 20px; border-radius: 12px; border: 1px solid #2A3A32; background: transparent; color: #EDF5F0; font-size: 15px; font-weight: 900; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">SKIP PHASE ›<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ addMinute }}\" style=\"min-height: 52px; padding: 12px 20px; border-radius: 12px; border: 1px solid #2A3A32; background: transparent; color: #EDF5F0; font-size: 15px; font-weight: 900; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">+1 MIN<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ endRun }}\" style=\"min-height: 52px; padding: 12px 22px; border-radius: 12px; border: 2px solid #FF8A5C; background: transparent; color: #FF8A5C; font-size: 15px; font-weight: 900; letter-spacing: 1px; cursor: pointer; animation: {{ endAnim }};\" style-hover=\"background: rgba(255,138,92,.1);\">TURN THE PAGE ›<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isComplete }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: fixed; inset: 0; background: rgba(12,18,16,.96); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;\">\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 18px; padding: 34px 30px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 10px 60px rgba(31,199,122,.15);\">\n            <div style=\"display: flex; height: 5px; width: 160px; border-radius: 3px; overflow: hidden; margin: 0 auto 18px;\">\n              <div style=\"flex: 1; background: #3BC0DB;\"><\u002Fdiv><div style=\"flex: 1; background: #8F7CF7;\"><\u002Fdiv><div style=\"flex: 1; background: #FF8A5C;\"><\u002Fdiv><div style=\"flex: 1; background: #1FC77A;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 1px; color: #1FC77A;\">{{ boardRunLabel }} · IN THE BOOKS<\u002Fdiv>\n            <div style=\"margin: 12px 0 22px; font-size: 16px; color: #93A69B;\">{{ completeLine }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ backLineup }}\" style=\"min-height: 52px; padding: 14px 28px; border-radius: 12px; border: 0; background: #1FC77A; color: #06130C; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer;\" style-hover=\"background: #53D337;\">BACK TO TODAY<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSub }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Sub Guide\">\n      <div style=\"background: #0C1210; border-bottom: 1px solid #2A3A32; padding: 14px 20px;\">\n        <div style=\"max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;\">\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <button sc-camel-on-click=\"{{ toSplash }}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; color: #93A69B; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">‹ BACK<\u002Fbutton>\n            <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #F3C650;\">SUB GUIDE<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #A8D2EE;\">WELCOME. THE BOARD DOES THE HEAVY LIFTING.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 980px; margin: 0 auto; padding: 20px 20px 60px;\">\n        <div style=\"background: #18231E; border: 1px solid #3A4F44; border-left: 5px solid #F3C650; border-radius: 14px; padding: 18px; margin-bottom: 16px;\">\n          <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #F3C650; margin-bottom: 10px;\">YOUR WHOLE JOB, 4 STEPS<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.55; color: #EDF5F0;\">\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: #F3C650; font-weight: 900; min-width: 18px;\">1<\u002Fspan><span>Pick the teacher you are covering below, and check today's schedule.<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: #F3C650; font-weight: 900; min-width: 18px;\">2<\u002Fspan><span>When a class walks in (back door), tap that class and hit START.<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: #F3C650; font-weight: 900; min-width: 18px;\">3<\u002Fspan><span>The board tells the kids what to do in each phase. The green NEXT MOVE line is your script. Kids know the rhythm.<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px;\"><span style=\"color: #F3C650; font-weight: 900; min-width: 18px;\">4<\u002Fspan><span>At LINE UP, kids clean and line up at the front door. Their homeroom teacher picks them up. Tap TURN THE PAGE only if the lesson truly finished.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;\">\n          <sc-for list=\"{{ subTeachers }}\" as=\"st\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ st.pick }}\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 12px; font-size: 15px; font-weight: 900; letter-spacing: 1px; cursor: pointer; border: 1px solid {{ st.border }}; background: {{ st.bg }}; color: {{ st.fg }};\">{{ st.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ scheduleRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n            <sc-if value=\"{{ row.isClass }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ row.open }}\" style=\"text-align: left; background: #18231E; border: 1px solid #2A3A32; border-left: 5px solid {{ row.arcColor }}; border-radius: 12px; padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 16px; min-height: 56px;\" style-hover=\"border-color: #1FC77A;\">\n                <span style=\"font-size: 17px; font-weight: 900; min-width: 62px; color: #fff;\">{{ row.time }}<\u002Fspan>\n                <span style=\"flex: 1; font-size: 16px; font-weight: 900; color: #EDF5F0;\">{{ row.name }} <span style=\"font-size: 11px; color: {{ row.gradeC }};\">{{ row.gradeLabel }}<\u002Fspan><\u002Fspan>\n                <span style=\"font-size: 12px; color: #93A69B;\">{{ row.runLabel }}<\u002Fspan>\n                <span style=\"font-size: 18px; color: #4A5C52;\">›<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ row.isBlock }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; gap: 16px; padding: 6px 16px 6px 21px; border-radius: 10px; background: rgba(24,35,30,.45); border: 1px dashed #2A3A32;\">\n                <span style=\"font-size: 12px; font-weight: 900; min-width: 62px; color: #5C7065;\">{{ row.time }}<\u002Fspan>\n                <span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: #93A69B;\">{{ row.label }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #5C7065;\">{{ row.sub }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ row.isTapBlock }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; gap: 16px; padding: 6px 16px 6px 21px; border-radius: 10px; background: rgba(24,35,30,.45); border: 1px dashed #2A3A32;\">\n                <span style=\"font-size: 12px; font-weight: 900; min-width: 62px; color: #5C7065;\">{{ row.time }}<\u002Fspan>\n                <span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: #93A69B;\">{{ row.label }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #5C7065;\">{{ row.sub }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;\">\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n            <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #1FC77A; margin-bottom: 8px;\">HOUSE RULES<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Kids come in the back door, leave out the front. Homeroom teams walk them here and pick them up: you never escort. No attendance except WIN and clubs (paper). Handle behavior in the room; office only for something serious.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n            <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #FF8A5C; margin-bottom: 8px;\">IF THINGS GO SIDEWAYS<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Student escalating beyond management: call the office; hearing GROUP on announcements means the trained team is coming. A missing student turns up here: say \"I got him\" and call the office. Broken tech: report to Steve.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n            <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #3BC0DB; margin-bottom: 8px;\">IF THE LESSON WON'T RUN<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Grades 5-6 fallback: digital citizenship discussion or Code.org free play, both sub-safe. Kindergarten fallback: read a story, then drawing centers. Front office (Emily Ladd, Heather Ruppert) answers everything else.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(168,210,238,.06); border: 1px solid rgba(168,210,238,.25); font-size: 12px; font-weight: bold; letter-spacing: 1px; color: #A8D2EE;\">{{ dayFrame }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isWin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"WIN\">\n      <div style=\"background: #0C1210; border-bottom: 1px solid #2A3A32; padding: 14px 20px;\">\n        <div style=\"max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px;\">\n          <button sc-camel-on-click=\"{{ backLineup }}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; color: #93A69B; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">‹ TODAY<\u002Fbutton>\n          <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #fff;\">WIN · HIGH FLIERS<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 980px; margin: 0 auto; padding: 20px 20px 60px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"background: #18231E; border: 1px solid #3A4F44; border-left: 5px solid #FF8A5C; border-radius: 14px; padding: 16px;\">\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #FF8A5C; margin-bottom: 8px;\">EVERY WIN BLOCK, NO EXCEPTIONS<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #EDF5F0; line-height: 1.7;\">Take attendance ON PAPER: kids disperse by design, so paper is the record. A kid misses twice in a row: investigate. The grade teams send your roster (\"expect these 7 from Bonicky\") after each testing window.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;\">\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n            <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #1FC77A; margin-bottom: 8px;\">HOW WIN WORKS<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Your WIN groups are enrichment: challenge kids who don't need reading or math help. Groups form ~October after NWEA and STAR testing, reshuffle after the January retest. Rosters stay stable between windows.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n            <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #8F7CF7; margin-bottom: 8px;\">TWO SEASON ARCS<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Design enrichment as two clean arcs, not one year-long build: Fall cohort finishes with a finale by December 22. New January cohort starts fresh after the retest. Same shell, new crew.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #3BC0DB; margin-bottom: 8px;\">WIN NOTES · DAY {{ day }}<\u002Fdiv>\n          <input value=\"{{ winNote }}\" sc-camel-on-change=\"{{ onWinNote }}\" placeholder=\"roster changes, who was missing, what worked...\" style=\"width: 100%; min-height: 48px; border: 1px solid #2A3A32; border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #EDF5F0; background: #101A15; box-sizing: border-box;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFlex }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Day 3 Flex\">\n      <div style=\"background: #0C1210; border-bottom: 1px solid #2A3A32; padding: 14px 20px;\">\n        <div style=\"max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px;\">\n          <button sc-camel-on-click=\"{{ backLineup }}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; color: #93A69B; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">‹ TODAY<\u002Fbutton>\n          <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #fff;\">DAY 3 FLEX · 2:50-3:25<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 980px; margin: 0 auto; padding: 20px 20px 60px; display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"display: flex; gap: 10px; align-items: center; flex-wrap: wrap;\">\n          <span style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #93A69B;\">THIS DAY 3 IS:<\u002Fspan>\n          <sc-for list=\"{{ flexPills }}\" as=\"fp\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ fp.pick }}\" style=\"min-height: 44px; padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 900; letter-spacing: 1px; cursor: pointer; border: 1px solid {{ fp.border }}; background: {{ fp.bg }}; color: {{ fp.fg }};\">{{ fp.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"font-size: 12px; color: #5C7065;\">Last year alternated LEAD week / clubs week. Confirm the cadence with Mr. Eiler.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-left: 5px solid #8F7CF7; border-radius: 14px; padding: 16px;\">\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #8F7CF7; margin-bottom: 8px;\">LEAD WEEK · CHARACTERSTRONG<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Structure: Start 5-10 → Connect game 5-10 → Grow lesson 20-30 → Respond → Exit. Reality: you have ~25 usable minutes because pickup pulls kids ~3:15. Run the opener tight, trim Grow, let the Week 4 extra absorb drift. Delivered in your partner teacher's room: partner assignment TBD (Sandy's was Luke Mesa: ask Mr. Eiler). Platform: CharacterStrong, Tier 1 → grade → theme → week, scripted to slide numbers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-left: 5px solid #3BC0DB; border-radius: 14px; padding: 16px;\">\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #3BC0DB; margin-bottom: 8px;\">CLUBS WEEK<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">Clubs start ~November: Mr. Eiler sends the signup form, kids pick top 3, a scheduler assigns. Once or twice a month. Paper attendance. Start dismissing club kids ~3:15-3:18.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 16px;\">\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #1FC77A; margin-bottom: 8px;\">SEPTEMBER, BEFORE LEAD STARTS<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.7;\">LEAD launched ~mid-October last year, so early Day 3 flex slots are yours: CIRC Tank warm-ups, routine practice, or catch-up sprints. Open question for Tammy: what filled this slot last September?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLounge }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Teacher's Lounge\">\n      <div style=\"background: #0C1210; border-bottom: 1px solid #2A3A32; padding: 14px 20px;\">\n        <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;\">\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <button sc-camel-on-click=\"{{ backLineup }}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; color: #93A69B; font-weight: 900; font-size: 13px; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">‹ BACK<\u002Fbutton>\n            <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #fff;\">TEACHER'S LOUNGE<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; color: #A8D2EE;\">EHRMAN CREST · CIRC<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; height: 3px;\">\n        <div style=\"flex: 1; background: #3BC0DB;\"><\u002Fdiv><div style=\"flex: 1; background: #8F7CF7;\"><\u002Fdiv><div style=\"flex: 1; background: #FF8A5C;\"><\u002Fdiv><div style=\"flex: 1; background: #1FC77A;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px;\">\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 18px; margin-bottom: 16px;\">\n          <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #1FC77A; margin-bottom: 10px;\">DAY {{ day }} PREP · LESSONS AT A GLANCE<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;\">\n            <sc-for list=\"{{ prepGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"border: 1px solid #2A3A32; border-left: 5px solid {{ g.color }}; border-radius: 10px; padding: 12px 14px; background: #14201A;\">\n                <div style=\"font-size: 12px; font-weight: 900; letter-spacing: 1px; color: {{ g.color }};\">{{ g.head }}<\u002Fdiv>\n                <div style=\"font-size: 17px; font-weight: 900; margin: 3px 0; color: #EDF5F0;\">{{ g.title }}<\u002Fdiv>\n                <div style=\"font-size: 13px; color: #93A69B;\">{{ g.who }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 18px; margin-bottom: 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;\">\n            <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #F3C650;\">SDI WEEK-ONE CHECKLIST<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #93A69B;\">Tap a class when its SDIs are acknowledged. The stamp saves the date.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.6; margin-bottom: 12px;\">The routine: open the section's gradebook → each flagged student → paste \"Acknowledged [date] for entire year\" into every applicable SDI box → save. Skip subject-only SDIs that don't apply in CIRC. About 2 minutes a section = timestamped proof you read every accommodation.<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <sc-for list=\"{{ sdiRows }}\" as=\"sd\" hint-placeholder-count=\"12\">\n              <button sc-camel-on-click=\"{{ sd.toggle }}\" style=\"min-height: 44px; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 900; cursor: pointer; border: 1px solid {{ sd.border }}; background: {{ sd.bg }}; color: {{ sd.fg }};\">{{ sd.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 18px; margin-bottom: 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 6px;\">\n            <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #1FC77A;\">EVERY SECTION · BOOKMARKS &amp; NOTES<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #93A69B;\">Steppers fix bookmark drift after holidays. Notes stick to the class.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ rosterRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1E2C25;\">\n              <span style=\"width: 52px; font-size: 12px; font-weight: 900; color: #5C7065;\">DAY {{ r.day }}<\u002Fspan>\n              <span style=\"flex: 1 1 130px; min-width: 120px; font-size: 16px; font-weight: 900; color: #EDF5F0;\">{{ r.name }} <span style=\"font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 999px; border: 1px solid {{ r.gradeC }}; color: {{ r.gradeC }};\">{{ r.gradeLabel }}<\u002Fspan><\u002Fspan>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px;\">\n                <button sc-camel-on-click=\"{{ r.dec }}\" style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; font-size: 18px; font-weight: 900; cursor: pointer; color: #93A69B;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">−<\u002Fbutton>\n                <span style=\"min-width: 74px; text-align: center; font-size: 13px; font-weight: 900; letter-spacing: 1px; color: {{ r.arcColor }};\">{{ r.runLabel }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ r.inc }}\" style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; font-size: 18px; font-weight: 900; cursor: pointer; color: #93A69B;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">+<\u002Fbutton>\n              <\u002Fspan>\n              <span style=\"flex: 1 1 170px; min-width: 150px; font-size: 13px; color: #93A69B;\">{{ r.runTitle }}<\u002Fspan>\n              <input value=\"{{ r.note }}\" sc-camel-on-change=\"{{ r.onNote }}\" placeholder=\"note to self...\" style=\"flex: 1 1 180px; min-width: 160px; min-height: 40px; border: 1px solid #2A3A32; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #EDF5F0; background: #101A15; box-sizing: border-box;\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n          <sc-for list=\"{{ seasonCols }}\" as=\"col\" hint-placeholder-count=\"3\">\n            <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 18px;\">\n              <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #1FC77A; margin-bottom: 4px;\">{{ col.head }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #5C7065; margin-bottom: 10px;\">● means the page is fully scripted<\u002Fdiv>\n              <sc-for list=\"{{ col.rows }}\" as=\"s\" hint-placeholder-count=\"10\">\n                <div style=\"display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-left: 4px solid {{ s.color }}; padding-left: 10px; margin: 2px 0;\">\n                  <span style=\"font-size: 12px; font-weight: 900; color: {{ s.color }}; min-width: 26px;\">{{ s.num }}<\u002Fspan>\n                  <span style=\"font-size: 14px; color: #EDF5F0; font-weight: {{ s.weight }}; flex: 1;\">{{ s.title }}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: {{ s.color }};\">{{ s.dot }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 14px; padding: 18px; margin-top: 16px;\">\n          <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #3BC0DB; margin-bottom: 8px;\">BACKUP &amp; RESTORE<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #C7D6CC; line-height: 1.6; margin-bottom: 12px;\">Everything saves itself on THIS device the moment you tap: bookmarks, notes, SDI stamps, cycle day. It does not sync between devices. Once a week, copy a backup code and stash it (email it to yourself). New device or cleared browser: restore from the code and you're back.<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n            <button sc-camel-on-click=\"{{ copyBackup }}\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 12px; border: 0; background: #1FC77A; color: #06130C; font-size: 14px; font-weight: 900; letter-spacing: 1px; cursor: pointer;\" style-hover=\"background: #53D337;\">COPY BACKUP CODE<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ restoreBackup }}\" style=\"min-height: 48px; padding: 12px 22px; border-radius: 12px; border: 1px solid #2A3A32; background: transparent; color: #EDF5F0; font-size: 14px; font-weight: 900; letter-spacing: 1px; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">RESTORE FROM CODE<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 18px; color: #5C7065; font-size: 12px; text-align: center;\">Chapters: FOUNDATIONS pages 1-7 · DISCOVERY 8-15 · CREATION 16-24 · LEGACY 25-30. Every class earns its band when a chapter closes.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(12,18,16,.92); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 90;\">\n      <div style=\"background: #18231E; border: 1px solid #2A3A32; border-radius: 18px; padding: 28px; max-width: 640px; width: 100%; max-height: 84vh; overflow: auto; box-sizing: border-box;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px;\">\n          <div style=\"font-family: 'Chakra Petch', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #fff;\">HOW THE PLAYBOOK WORKS<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeHelp }}\" style=\"min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid #2A3A32; background: transparent; color: #93A69B; font-size: 18px; font-weight: 900; cursor: pointer;\" style-hover=\"border-color: #1FC77A; color: #1FC77A;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.55; color: #EDF5F0;\">\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">1<\u002Fspan><span>The app already knows today's cycle day, synced to the SVSD calendar. Wrong after a weird day? Override it with the day pills on the schedule screen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">2<\u002Fspan><span>Tap your teacher, then the class that just walked in. Every class keeps its own bookmark, so it opens on exactly the right page even after holidays, delays, or a sub day.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">3<\u002Fspan><span>Hit START. The board runs the whole period: TALK 8 · MAKE 15 · SHOW 5 · LINE UP 7. That is a true 35 minutes including cleanup and the two-minute door chat.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">4<\u002Fspan><span>Kids read the big RIGHT NOW panel. The green NEXT MOVE line is yours: what to do, who to watch, when to move.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">5<\u002Fspan><span>TURN THE PAGE when the class finishes. The bookmark advances and saves on this device instantly.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">6<\u002Fspan><span>TEACHER'S LOUNGE is your back office: today's prep, every bookmark, notes, the SDI checklist, and backup.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px;\"><span style=\"color: #1FC77A; font-weight: 900; min-width: 18px;\">7<\u002Fspan><span>Covering teacher? The SUB GUIDE on the splash screen runs the room without you.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: rgba(168,210,238,.06); border: 1px solid rgba(168,210,238,.25); font-size: 12px; font-weight: bold; letter-spacing: 1px; color: #A8D2EE;\">YOUR DAY · IN BUILDING 8:10 · FIRST BELL 8:40 · FIRST CLASS 9:05 · LUNCH 12:20 (11:38 ON DAY 3) · BUSES + DUTY 3:25 · DONE 3:40<\u002Fdiv>\n        <div style=\"margin-top: 10px; font-size: 12px; color: #5C7065;\">Two-hour delay or FID day? Same cycle day, 20-minute periods: switch the timer preset to the delay-day rhythm in Tweaks.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" d ve()); },\n        isComplete: s.complete,\n        completeLine: run >= 30 ? cls.n + ' finished every page of the year. Time to celebrate.' : cls.n + ' turns to Page ' + this.pad(run + 1) + (nextTitle ? ' · ' + nextTitle : '') + '.'\n      });\n    } else { Object.assign(vals, { cueVisible: false, isComplete: false, phaseChips: [], phaseDividers: [], timeLeft: '', progressPct: 0, timerColor: '#1FC77A', timerGlow: 'rgba(31,199,122,.3)', timerAnim: 'none', endAnim: 'none', rightNow: '', teacherCue: '', boardClass: '', boardGrade: '', boardRunLabel: '', boardArcName: '', boardArcColor: '#1FC77A' }); }\n    if (s.view === 'lounge') {\n      const groups = {}, seen = new Set();\n      ['macek', 'micco'].forEach(t => ((this.SLOTS[t] || {})[s.day] || []).forEach(slot => {\n        const id = slot[0];\n        if (seen.has(id)) return; seen.add(id);\n        const cls = this.CLASSES[id], run = Math.min(s.pointers[id], 30), key = cls.g + '-' + run;\n        if (!groups[key]) groups[key] = { g: cls.g, run, names: [] };\n        groups[key].names.push(cls.n);\n      }));\n      vals.prepGroups = Object.values(groups).sort((a, b) => String(a.g).localeCompare(String(b.g)) || a.run - b.run).map(gr => ({ head: this.gradeLabel(gr.g) + ' · PAGE ' + this.pad(gr.run), title: this.titleOf(gr.g, gr.run), who: gr.names.length + (gr.names.length === 1 ? ' class: ' : ' classes: ') + gr.names.join(', '), color: this.arcOf(gr.run).c }));\n      const dayOf = id => { for (let d = 1; d <= 5; d++) { if ((this.SLOTS.macek[d] || []).some(x => x[0] === id) || (this.SLOTS.micco[d] || []).some(x => x[0] === id)) return d; } return '·'; };\n      const ids = Object.keys(this.CLASSES);\n      vals.sdiRows = ids.map(id => {\n        const cls = this.CLASSES[id], on = s.sdi[id];\n        return { label: (on ? '✓ ' : '') + cls.n + (on ? ' · ' + on : ''), bg: on ? 'rgba(243,198,80,.14)' : 'transparent', fg: on ? '#F3C650' : '#93A69B', border: on ? '#F3C650' : '#2A3A32', toggle: () => { const d = Object.a
